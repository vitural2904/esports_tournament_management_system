name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: API and domain tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install verified Caddy for HTTPS and Linux checks
        run: |
          mkdir -p /tmp/bracket-caddy
          cd /tmp/bracket-caddy
          curl --fail --location --output caddy_2.11.7_linux_amd64.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          curl --fail --location --output checksums.txt https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_checksums.txt
          awk '$2 == "caddy_2.11.7_linux_amd64.tar.gz" { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf caddy_2.11.7_linux_amd64.tar.gz caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy
      - name: Typecheck, build and UI regressions
        run: npm run test:ui
      - name: Release and backup recovery checks
        run: node --test tests/operations/*.test.mjs
      - name: Check deployment scripts and actual Linux service lifecycle
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes shellcheck
          shellcheck deploy/*.sh
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true bash deploy/verify-linux-ci.sh
      - name: Upload UI report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-regression-report
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
